<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">GPU: same 400 kpps, split over more queues</title>
<desc id="desc">GPU poller (CUDA): 1 × 400k -&gt; 18.9, 2 × 200k -&gt; 11.4, 4 × 100k -&gt; 7.23, 8 × 50k -&gt; 6.6</desc>
