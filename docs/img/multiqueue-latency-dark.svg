<text x="24.0" y="58.0" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">Mean detection latency. Each queue has its own producer, copy stream and poller.</text>
<text x="24.0" y="96.0" fill="#898781" font-size="12" font-weight="400" text-anchor="start">µs</text>
